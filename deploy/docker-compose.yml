# CONCORDE v1.0 — déploiement Docker (c) MASITH / Stéphane Moreau
# PostgreSQL 16 + Odoo 17 (8017) + 18 (8018) + 19 (8019) + 20 (8020)
# Usage : docker compose up -d

services:
  postgres:
    image: postgres:16
    container_name: concorde-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-odoo}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGEZ_MOI}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  odoo:
    image: odoo:17
    container_name: concorde-odoo
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8017:8069"
      - "8021:8072"
    environment:
      HOST: postgres
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:-CHANGEZ_MOI}
      DB_NAME: ${POSTGRES_DB:-odoo}
      ADMIN_PASSWD: ${ADMIN_PASSWD:-CHANGEZ_MOI_ADMIN}
    volumes:
      - odoodata:/var/lib/odoo
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./addons:/mnt/extra-addons:ro
    command: odoo -c /etc/odoo/odoo.conf

  odoo18:
    image: odoo:18
    container_name: concorde-odoo18
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8018:8069"
    environment:
      HOST: postgres
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:-CHANGEZ_MOI}
      ADMIN_PASSWD: ${ADMIN_PASSWD:-CHANGEZ_MOI_ADMIN}
    volumes:
      - odoo18data:/var/lib/odoo
      - ./addons18:/mnt/extra-addons:ro
    command: odoo --db-filter=^odoo18$ -d odoo18 --http-interface=0.0.0.0

  odoo19:
    image: odoo:19
    container_name: concorde-odoo19
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8019:8069"
    environment:
      HOST: postgres
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:-CHANGEZ_MOI}
      ADMIN_PASSWD: ${ADMIN_PASSWD:-CHANGEZ_MOI_ADMIN}
    volumes:
      - odoo19data:/var/lib/odoo
      - ./addons19:/mnt/extra-addons:ro
    command: odoo --db-filter=^odoo19$ -d odoo19 --http-interface=0.0.0.0

  odoo20:
    image: odoo:20
    container_name: concorde-odoo20
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8020:8069"
    environment:
      HOST: postgres
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:-CHANGEZ_MOI}
      ADMIN_PASSWD: ${ADMIN_PASSWD:-CHANGEZ_MOI_ADMIN}
    volumes:
      - odoo20data:/var/lib/odoo
      - ./addons20:/mnt/extra-addons:ro
    command: odoo --db-filter=^odoo20$ -d odoo20 --http-interface=0.0.0.0

volumes:
  pgdata:
  odoodata:
  odoo18data:
  odoo19data:
  odoo20data:
