# CI CONCORDE : chaque contrôle BLOQUE en cas d'échec. Aucune étape ne
# masque une erreur et aucun message de succès n'est écrit en dur.
name: qualite

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  qualite:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # 3.10 : Python minimal d'Odoo 17 (le moteur core/ y est embarqué) ;
        # 3.14 : Python du serveur de production.
        python-version: ["3.10", "3.14"]
    env:
      CODE: >-
        core injectors interface securite scripts samples tests
        deploy/webhook.py deploy/addons/concorde stubs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Outils (versions figées)
        run: >-
          python -m pip install
          flake8==7.4.1 black==26.10.1 mypy==2.4.0 pytest==9.1.1
          bandit==1.9.4 pylint==4.1.3 openpyxl==3.1.5 psycopg2-binary==2.9.13
          defusedxml==0.7.1 coverage==7.16.2
      - name: Lint (flake8, règles par défaut)
        run: flake8 $CODE
      - name: Format (black)
        run: black --check $CODE
      - name: Types (mypy --strict)
        run: mypy $CODE
      - name: Docstrings (pylint)
        run: >-
          pylint --disable=all
          --enable=missing-function-docstring,missing-class-docstring,missing-module-docstring
          $CODE
      # bandit_reference.json : 16 alertes revues et acceptées le 08/11/2026
      # (détail dans CHANGELOG 1.5.0, Sécurité). Toute alerte absente de
      # cette liste fait échouer l'étape.
      - name: Sécurité (bandit)
        run: bandit -q -r $CODE -b bandit_reference.json
      - name: Pas de règle désactivée dans le code
        run: |
          if grep -rnE "noqa|type: *ignore|nosec|pylint: *disable|fmt: *off|pragma: *no cover" \
               --include=*.py $CODE; then
            echo "Règle désactivée trouvée : interdit (protocole § D)."
            exit 1
          fi
      - name: Pas d'erreur masquée dans les scripts
        run: |
          if grep -rnE "\|\| *true|continue-on-error|if: *always" \
               scripts deploy; then
            echo "Erreur masquée trouvée : interdit."
            exit 1
          fi
      - name: Tests (suite complète) et couverture minimale
        run: |
          python -m coverage run -m pytest -q -p no:cacheprovider -rs
          python -m coverage report

  # ADR-0010 : la photo comptable SQL est vérifiée sur un vrai Odoo de
  # chaque version, contre le calcul de l'ORM d'Odoo (zéro écart exigé).
  # Base jetable : identifiants de test, jamais un secret réel.
  photo-odoo:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        odoo: ["14.0", "15.0", "16.0", "17.0", "18.0"]
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      ODOO_URL: http://127.0.0.1:8069
      ODOO_BASE: concorde_photo
      ODOO_UTILISATEUR: admin
      ODOO_MOT_DE_PASSE: admin
      PGHOST: 127.0.0.1
      PGUSER: odoo
      PGPASSWORD: odoo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Outils (versions figées)
        run: python -m pip install psycopg2-binary==2.9.13 defusedxml==0.7.1
      - name: Base Odoo ${{ matrix.odoo }} avec la comptabilité
        run: |
          if ! docker run --rm --network host -e HOST=127.0.0.1 \
               odoo:${{ matrix.odoo }} -- -d "$ODOO_BASE" -i account \
               --stop-after-init > installation.log 2>&1; then
            tail -n 8 installation.log | sed 's/^/::error::/'
            exit 1
          fi
      - name: Serveur Odoo ${{ matrix.odoo }}
        run: |
          docker run -d --name odoo --network host -e HOST=127.0.0.1 \
            odoo:${{ matrix.odoo }} -- -d "$ODOO_BASE" \
            --db-filter "^${ODOO_BASE}$"
          python -m tests.integration.attendre_odoo
      - name: Photo SQL = calcul de l'ORM (zéro écart)
        run: python -m tests.integration.verifier_photo

  # ADR-0010 et ADR-0012 : montée 14 -> 17 conduite de bout en bout par la
  # commande concorde_montee (OpenUpgrade non modifié, commits figés dans
  # core/montee_version/openupgrade.py), puis la base livrée est restaurée
  # dans un vrai Odoo 17 et rephotographiée : zéro écart à chaque étape.
  montee-pilotee:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      ODOO_URL: http://127.0.0.1:8069
      ODOO_BASE: concorde_client
      ODOO_UTILISATEUR: admin
      ODOO_MOT_DE_PASSE: admin
      PGHOST: 127.0.0.1
      PGUSER: odoo
      PGPASSWORD: odoo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Outils (versions figées)
        run: python -m pip install psycopg2-binary==2.9.13 defusedxml==0.7.1
      - name: Base client Odoo 14 avec des écritures connues
        run: |
          if ! docker run --rm --network host -e HOST=127.0.0.1 odoo:14.0 \
               -- -d "$ODOO_BASE" -i account --stop-after-init \
               > installation.log 2>&1; then
            tail -n 8 installation.log | sed 's/^/::error::/'
            exit 1
          fi
          docker run -d --name odoo14 --network host -e HOST=127.0.0.1 \
            odoo:14.0 -- -d "$ODOO_BASE" --db-filter "^${ODOO_BASE}$"
          python -m tests.integration.attendre_odoo
          python -m tests.integration.verifier_photo
      - name: Sauvegarde Odoo (.zip), comme celle que donnerait le client
        run: |
          for nom in premiere fraiche; do
            curl -sf -X POST -o "$nom.zip" \
              -F master_pwd=admin -F name="$ODOO_BASE" -F backup_format=zip \
              "$ODOO_URL/web/database/backup"
            unzip -l "$nom.zip" | tail -n 1
          done
          docker stop odoo14
      - name: Montée conduite par CONCORDE (étapes 1 à 4)
        run: |
          montee() {
            sudo env "PATH=$PATH" python -m scripts.concorde_montee \
              --racine "$RUNNER_TEMP/montees" \
              --openupgrade "$RUNNER_TEMP/openupgrade" "$@"
          }
          if ! montee creer premiere.zip 17 > creer.log 2>&1; then
            tail -n 15 creer.log | sed 's/^/::error::creer : /'
            exit 1
          fi
          ident=$(tail -n 1 creer.log)
          echo "MONTEE=$ident" >> "$GITHUB_ENV"
          if ! montee circuit "$ident" > circuit.log 2>&1; then
            tail -n 25 circuit.log | sed 's/^/::error::circuit : /'
            exit 1
          fi
          cat circuit.log
      - name: Feu vert, nouvel essai sur une copie fraîche, livraison
        run: |
          montee() {
            sudo env "PATH=$PATH" python -m scripts.concorde_montee \
              --racine "$RUNNER_TEMP/montees" \
              --openupgrade "$RUNNER_TEMP/openupgrade" "$@"
          }
          if ! montee feu-vert "$MONTEE" "$ODOO_BASE" > feu.log 2>&1; then
            tail -n 15 feu.log | sed 's/^/::error::feu-vert : /'
            exit 1
          fi
          if ! montee nouvel-essai "$MONTEE" fraiche.zip > essai.log 2>&1; then
            tail -n 25 essai.log | sed 's/^/::error::nouvel-essai : /'
            exit 1
          fi
          if ! montee livrer "$MONTEE" > livraison.log 2>&1; then
            tail -n 15 livraison.log | sed 's/^/::error::livrer : /'
            exit 1
          fi
          cat livraison.log
          livre=$(sudo find "$RUNNER_TEMP/montees/$MONTEE/livraison" -name '*.zip')
          sudo cp "$livre" livree.zip
          sudo cp "$RUNNER_TEMP/montees/$MONTEE/photo_avant.json" avant.json
          sudo chown "$USER" livree.zip avant.json
      - name: La base livrée se restaure dans Odoo 17, sans écart
        run: |
          docker run -d --name odoo17 --network host -e HOST=127.0.0.1 \
            odoo:17.0
          python -m tests.integration.attendre_odoo
          curl -sf -X POST -o restauration.html \
            -F master_pwd=admin -F name=concorde_livree -F copy=true \
            -F backup_file=@livree.zip "$ODOO_URL/web/database/restore"
          python -m scripts.concorde_montee photo concorde_livree livree.json
          if ! python -m scripts.concorde_montee comparer avant.json \
               livree.json > comparaison.txt; then
            awk '/^ÉCART/ && n < 40 {print; n++}' comparaison.txt \
              | sed 's/^/::error::/'
            tail -n 1 comparaison.txt
            exit 1
          fi
          cat comparaison.txt
