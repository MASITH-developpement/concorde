# CI CONCORDE : chaque contrôle BLOQUE en cas d'échec. Aucune étape ne
# masque une erreur et aucun message de succès n'est écrit en dur.
name: qualite

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  qualite:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # 3.10 : Python minimal d'Odoo 17 (le moteur core/ y est embarqué) ;
        # 3.14 : Python du serveur de production.
        python-version: ["3.10", "3.14"]
    env:
      CODE: >-
        core injectors interface securite scripts samples tests
        deploy/webhook.py deploy/addons/concorde stubs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Outils (versions figées)
        run: >-
          python -m pip install
          flake8==7.4.1 black==26.10.1 mypy==2.4.0 pytest==9.1.1
          bandit==1.9.4 pylint==4.1.3 openpyxl==3.1.5 psycopg2-binary==2.9.13
          defusedxml==0.7.1 coverage==7.16.2
      - name: Lint (flake8, règles par défaut)
        run: flake8 $CODE
      - name: Format (black)
        run: black --check $CODE
      - name: Types (mypy --strict)
        run: mypy $CODE
      - name: Docstrings (pylint)
        run: >-
          pylint --disable=all
          --enable=missing-function-docstring,missing-class-docstring,missing-module-docstring
          $CODE
      # bandit_reference.json : 16 alertes revues et acceptées le 08/11/2026
      # (détail dans CHANGELOG 1.5.0, Sécurité). Toute alerte absente de
      # cette liste fait échouer l'étape.
      - name: Sécurité (bandit)
        run: bandit -q -r $CODE -b bandit_reference.json
      - name: Pas de règle désactivée dans le code
        run: |
          if grep -rnE "noqa|type: *ignore|nosec|pylint: *disable|fmt: *off|pragma: *no cover" \
               --include=*.py $CODE; then
            echo "Règle désactivée trouvée : interdit (protocole § D)."
            exit 1
          fi
      - name: Pas d'erreur masquée dans les scripts
        run: |
          if grep -rnE "\|\| *true|continue-on-error|if: *always" \
               scripts deploy; then
            echo "Erreur masquée trouvée : interdit."
            exit 1
          fi
      - name: Tests (suite complète) et couverture minimale
        run: |
          python -m coverage run -m pytest -q -p no:cacheprovider -rs
          python -m coverage report
