# Configuration des outils de qualité CONCORDE.
# Règle : aucun assouplissement. Seuls les dossiers générés ou tiers sont exclus.

[tool.black]
line-length = 79  # = limite par défaut de flake8 (plus stricte que les 88 de black)
extend-exclude = "deploy/(addons/concorde/engine|addons1[89]|addons20|addons/om_|addons/accounting_pdf_reports)"

[tool.mypy]
strict = true
mypy_path = "stubs"
exclude = ["deploy/addons/concorde/engine/", "deploy/addons1[89]/", "deploy/addons20/"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pylint.main]
# __manifest__.py n'est pas un module Python : Odoo le lit comme une donnée
# (ast.literal_eval) et une docstring le rendrait illisible.
ignore-patterns = ["__manifest__\\.py"]

[tool.coverage.run]
# Couverture mesurée sur le cœur et l'interface de Concorde (hors module Odoo,
# injecteurs Odoo et surveillance du serveur).
source = ["core", "interface"]

[tool.coverage.report]
# Plancher = couverture mesurée le 08/11/2026 (83,0 %) : ne jamais le baisser.
fail_under = 83
