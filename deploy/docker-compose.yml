# CONCORDE v1.0 — déploiement Docker (c) MASITH / Stéphane Moreau
# PostgreSQL 16 + Odoo 17 (8017) + 18 (8018) + 19 (8019) + 20 (8020)
# Usage : docker compose up -d

services:
  postgres:
    image: postgres:16
    container_name: concorde-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-odoo}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGEZ_MOI}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  odoo:
    image: odoo:17
    container_name: concorde-odoo
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8017:8069"
      - "8021:8072"
    environment:
      HOST: postgres
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:-CHANGEZ_MOI}
      DB_NAME: ${POSTGRES_DB:-odoo}
      ADMIN_PASSWD: ${ADMIN_PASSWD:-CHANGEZ_MOI_ADMIN}
    volumes:
      - odoodata:/var/lib/odoo
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./addons:/mnt/extra-addons:ro
    command: odoo -c /etc/odoo/odoo.conf

volumes:
  pgdata:
  odoodata:
